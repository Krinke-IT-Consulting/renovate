schema: spec-driven

context: |
  Produkt: zentrale, selbst gehostete Renovate-Plattform für die GitHub-Repos von
  Hiwamashi und Krinke-IT-Consulting (Anforderungen: PRD.md). Öffentliches Repo,
  daher niemals Secrets oder kundenbezogene Daten im Repo.
  Tech stack: Mend Renovate CE (ghcr.io/mend/renovate-ce, Version gepinnt) mit
  globaler config.js und Shared Preset default.json; Dashboard in Next.js
  (App Router, TypeScript), Tailwind CSS, shadcn/ui, TanStack Table; PostgreSQL
  mit Drizzle ORM; Octokit (GitHub App, Installation-Tokens); Authelia als
  Forward-Auth; Deployment als Docker-Compose-Stack in Coolify (Traefik);
  Build-Check als GitHub Actions Reusable Workflow.
  Konventionen: Conventional Commits; alle Plattformzugriffe über das Interface
  PlatformAdapter (MVP: GitHubAdapter, später GitLabAdapter); Datenmodell ist
  mandantenfähig vorbereitet (Tenant); Oberfläche auf Deutsch, Design laut
  DESIGN.md (angelehnt an krinke.me), nur heller Modus.
  Fachbegriffe: Onboarding-PR (renovate.json + Build-Check-Aufruf), Build-Check,
  Dependency Dashboard, Job (Renovate-CE-Lauf), Problem, RolloutAction.

