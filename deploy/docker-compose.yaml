# Renovate-Plattform fuer Coolify (Change compose-stack).
# Coolify: Base Directory = /deploy, Compose-Datei = /docker-compose.yaml.
# Build-Kontexte sind relativ zu dieser Datei (./postgres, ./authelia,
# ../renovate-ce, ../dashboard).
#
# In Coolify bekommt KEIN Dienst eine Domain. Alle drei oeffentlichen Ziele werden ueber die
# eigenen Traefik-Labels unten geroutet:
#   renovate.krinke-it.cloud/webhook (exakt) -> renovate-ce:8080, ohne Login
#   renovate.krinke-it.cloud (alles andere)  -> renovate-dashboard:3000, hinter Authelia
#   renovate-auth.krinke-it.cloud            -> renovate-authelia:9091
# Coolify-Domains wuerden zusaetzliche Router erzeugen: bei renovate-ce mit Strip-Prefix-Risiko
# (/webhook/api koennte die CE-API oeffnen), beim Dashboard einen ungeschuetzten Router fuer
# "/", und bei Authelia verwirft die Coolify-API den Port 9091 aus der Domain.
# Kein Dienst veroeffentlicht Ports. Die Job-API von CE bleibt im Stack-Netz.
#
# Geheimnisse nur als Variablen-Platzhalter; Werte stehen in Coolify (Herkunft: .env.example).
# Kein ${VAR:?} hier: Coolify fuehrt `compose build` nur mit Build-Variablen aus, die Secrets
# sind bewusst nur zur Laufzeit gesetzt. Pflichtwerte prueft stattdessen der Containerstart:
# renovate-ce ueber renovate-ce/check-env.sh, Postgres ueber sein Init-Skript und das offizielle
# Image, Authelia selbst (startet ohne seine Secrets nicht).

services:
  postgres:
    build:
      context: ./postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RENOVATE_CE_DB_PASSWORD: ${RENOVATE_CE_DB_PASSWORD}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  renovate-ce:
    build:
      context: ../renovate-ce
    restart: unless-stopped
    # Harte Grenze: der Server hat 7,7 GB RAM ohne Swap und traegt weitere Dienste (vaultsync).
    # Ohne Grenze koennte ein Lockfile-Lauf den ganzen Host an den OOM-Killer bringen.
    mem_limit: 3g
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MEND_RNV_ACCEPT_TOS: "y"
      MEND_RNV_LICENSE_KEY: ${MEND_RNV_LICENSE_KEY}
      MEND_RNV_PLATFORM: github
      MEND_RNV_GITHUB_APP_ID: ${MEND_RNV_GITHUB_APP_ID}
      MEND_RNV_GITHUB_APP_KEY: ${MEND_RNV_GITHUB_APP_KEY}
      MEND_RNV_WEBHOOK_SECRET: ${MEND_RNV_WEBHOOK_SECRET}
      MEND_RNV_SERVER_PORT: "8080"
      # Job-API fuer das Dashboard; nur intern erreichbar (kein oeffentlicher Router).
      MEND_RNV_API_ENABLED: "true"
      MEND_RNV_API_ENABLE_JOBS: "true"
      # System-API (App-Sync, Lauf fuer ein Repo anstossen); vom Dashboard benoetigt, nur intern.
      MEND_RNV_API_ENABLE_SYSTEM: "true"
      # Reporting-API (Repo-Status, z. B. orgs/{org}/-/repos) fuer das Dashboard; nur intern.
      MEND_RNV_API_ENABLE_REPORTING: "true"
      MEND_RNV_API_SERVER_SECRET: ${MEND_RNV_API_SERVER_SECRET}
      MEND_RNV_AUTODISCOVER_FILTER: "Hiwamashi/*,Krinke-IT-Consulting/*"
      MEND_RNV_DATA_HANDLER_TYPE: postgresql
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: renovate_ce
      PGUSER: renovate_ce
      PGPASSWORD: ${RENOVATE_CE_DB_PASSWORD}
      SCW_REGISTRY_SECRET_KEY: ${SCW_REGISTRY_SECRET_KEY:-}
    volumes:
      - renovate-cache:/tmp/renovate
    networks:
      default:
      # Ohne Coolify-Domain im Proxy-Netz, damit Traefik CE erreicht.
      coolify:
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      # Eigener Webhook-Router. Nur der exakte Pfad /webhook (Path, nicht PathPrefix) erreicht
      # CE; /webhook/... und /api/... gehen nie hierher.
      # Prioritaet 100: ueber dem Catch-all des Dashboards (1), damit der Webhook nie am Login
      # landet, unabhaengig von Regellaengen. Die Redirect-Middleware renovate-redirect-https
      # ist am Dashboard definiert und wird hier wiederverwendet.
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.renovate-webhook.loadbalancer.server.port=8080
      - traefik.http.routers.renovate-webhook.rule=Host(`renovate.krinke-it.cloud`) && Path(`/webhook`)
      - traefik.http.routers.renovate-webhook.priority=100
      - traefik.http.routers.renovate-webhook.entryPoints=https
      - traefik.http.routers.renovate-webhook.tls=true
      - traefik.http.routers.renovate-webhook.tls.certresolver=letsencrypt
      - traefik.http.routers.renovate-webhook.service=renovate-webhook
      - traefik.http.routers.renovate-webhook-http.rule=Host(`renovate.krinke-it.cloud`) && Path(`/webhook`)
      - traefik.http.routers.renovate-webhook-http.priority=100
      - traefik.http.routers.renovate-webhook-http.entryPoints=http
      - traefik.http.routers.renovate-webhook-http.middlewares=renovate-redirect-https@docker
      # Redirect-Middleware identisch an jedem Dienst mit http-Router definiert: Traefik blendet
      # ungesunde Container aus, und die Router der anderen Dienste sollen davon nicht abhängen.
      - traefik.http.middlewares.renovate-redirect-https.redirectscheme.scheme=https
      - traefik.http.middlewares.renovate-redirect-https.redirectscheme.permanent=true
      - traefik.http.routers.renovate-webhook-http.service=noop@internal

  # Dienstname eindeutig, weil er als Alias im geteilten Proxy-Netz "coolify" erscheint
  # (vaultsync betreibt dort eine eigene Authelia).
  renovate-authelia:
    build:
      context: ./authelia
    restart: unless-stopped
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}
    volumes:
      - authelia-data:/data
    networks:
      default:
      # Zusaetzlich im Proxy-Netz, weil unklar ist, ob Coolify Traefik an das Stack-Netz haengt
      # (Forward-Auth-Aufruf und Router muessen Authelia erreichen). Erreichbar dort ueber den
      # eindeutigen Dienstnamen renovate-authelia.
      coolify:
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      # Forward-Auth-Middleware. Name "renovate-authelia" statt "authelia": Middleware-Namen
      # gelten global im Traefik des Servers, und vaultsync betreibt eine eigene Authelia.
      # Die Adresse ist intern (Dienstname im Proxy-Netz, siehe oben).
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.renovate-authelia.forwardauth.address=http://renovate-authelia:9091/api/authz/forward-auth
      - traefik.http.middlewares.renovate-authelia.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.renovate-authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Email,Remote-Name
      # Anmeldeportal renovate-auth.krinke-it.cloud (eigene Router, fester Port 9091).
      - traefik.http.services.renovate-auth.loadbalancer.server.port=9091
      - traefik.http.routers.renovate-auth.rule=Host(`renovate-auth.krinke-it.cloud`)
      - traefik.http.routers.renovate-auth.entryPoints=https
      - traefik.http.routers.renovate-auth.tls=true
      - traefik.http.routers.renovate-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.renovate-auth.service=renovate-auth
      - traefik.http.routers.renovate-auth-http.rule=Host(`renovate-auth.krinke-it.cloud`)
      - traefik.http.routers.renovate-auth-http.entryPoints=http
      - traefik.http.routers.renovate-auth-http.middlewares=renovate-redirect-https@docker
      # Redirect-Middleware identisch an jedem Dienst mit http-Router definiert: Traefik blendet
      # ungesunde Container aus, und die Router der anderen Dienste sollen davon nicht abhängen.
      - traefik.http.middlewares.renovate-redirect-https.redirectscheme.scheme=https
      - traefik.http.middlewares.renovate-redirect-https.redirectscheme.permanent=true
      - traefik.http.routers.renovate-auth-http.service=noop@internal

  # Dienstname eindeutig, weil er als Alias im geteilten Proxy-Netz "coolify" erscheint.
  renovate-dashboard:
    # In Coolify KEINE Domain fuer diesen Dienst setzen: Coolify wuerde sonst einen zweiten,
    # ungeschuetzten Router fuer renovate.krinke-it.cloud erzeugen. Der Dienst wird nur ueber
    # die Labels unten geroutet.
    build:
      context: ../dashboard
    restart: unless-stopped
    # Harte Grenze, weil der Server nur 7,7 GB RAM ohne Swap hat (siehe renovate-ce).
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Passwort ist hex, daher ohne URL-Encoding in der Verbindungszeichenfolge.
      DATABASE_URL: postgresql://dashboard:${DASHBOARD_DB_PASSWORD}@postgres:5432/dashboard
      # Interne CE-API, nie ueber einen Router veroeffentlicht.
      RENOVATE_CE_API_URL: http://renovate-ce:8080
      # Gleiche Werte wie bei renovate-ce: ein Wert, ein Name, gemeinsamer Redeploy bei Wechsel.
      MEND_RNV_API_SERVER_SECRET: ${MEND_RNV_API_SERVER_SECRET}
      MEND_RNV_GITHUB_APP_ID: ${MEND_RNV_GITHUB_APP_ID}
      MEND_RNV_GITHUB_APP_KEY: ${MEND_RNV_GITHUB_APP_KEY}
      # Gleicher Wert steckt in der Traefik-Middleware renovate-dashboard-proxy (Labels unten).
      # Das Dashboard weist Anfragen ohne diesen Header mit 403 ab.
      DASHBOARD_PROXY_SECRET: ${DASHBOARD_PROXY_SECRET}
      TZ: Europe/Berlin
    networks:
      default:
      # Ohne Coolify-Domain ist unklar, ob Coolify den Dienst mit dem Proxy verbindet. Darum
      # haengt er zusaetzlich im externen Proxy-Netz "coolify", und traefik.docker.network
      # sagt Traefik, ueber welches Netz es ihn ansprechen soll.
      coolify:
    healthcheck:
      # Kein wget im Image; 127.0.0.1 statt localhost, weil Node localhost auch als ::1 aufloest.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      # Eigene Router "renovate-dashboard" (https) und "renovate-dashboard-http" (Weiterleitung).
      # Coolifys redirect_enabled gilt nur fuer von Coolify erzeugte Router, nicht fuer diese;
      # deshalb die eigene Redirect-Middleware (wird auch von den Routern an renovate-ce und
      # renovate-authelia wiederverwendet).
      # Prioritaet 1 = Catch-all fuer den Host; der Webhook-Router an renovate-ce (100) gewinnt
      # fuer /webhook immer.
      # Middleware-Kette: erst Authelia (Anmeldung, setzt Remote-*-Header), dann
      # renovate-dashboard-proxy (setzt das Proxy-Secret). So kommt das Secret nur ueber den
      # Router ans Dashboard; Aufrufe aus anderen Containern im Netz "coolify" bekommen 403.
      # Ob Coolify ${DASHBOARD_PROXY_SECRET} in Labels interpoliert, klaert das erste Deploy
      # (Rueckfall: Raw-Modus).
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.renovate-dashboard.loadbalancer.server.port=3000
      - traefik.http.routers.renovate-dashboard.rule=Host(`renovate.krinke-it.cloud`)
      - traefik.http.routers.renovate-dashboard.priority=1
      - traefik.http.routers.renovate-dashboard.entryPoints=https
      - traefik.http.routers.renovate-dashboard.tls=true
      - traefik.http.routers.renovate-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.renovate-dashboard.middlewares=renovate-authelia@docker,renovate-dashboard-proxy@docker
      - traefik.http.routers.renovate-dashboard.service=renovate-dashboard
      - traefik.http.middlewares.renovate-dashboard-proxy.headers.customrequestheaders.X-Dashboard-Proxy-Secret=${DASHBOARD_PROXY_SECRET}
      - traefik.http.routers.renovate-dashboard-http.rule=Host(`renovate.krinke-it.cloud`)
      - traefik.http.routers.renovate-dashboard-http.priority=1
      - traefik.http.routers.renovate-dashboard-http.entryPoints=http
      - traefik.http.routers.renovate-dashboard-http.middlewares=renovate-redirect-https@docker
      - traefik.http.routers.renovate-dashboard-http.service=noop@internal
      - traefik.http.middlewares.renovate-redirect-https.redirectscheme.scheme=https
      - traefik.http.middlewares.renovate-redirect-https.redirectscheme.permanent=true

networks:
  coolify:
    # Das Proxy-Netz von Coolify, existiert auf dem Server.
    external: true

volumes:
  postgres-data:
  authelia-data:
  renovate-cache:
