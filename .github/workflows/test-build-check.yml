name: Test Build-Check

# Selbsttest: Der Build-Check läuft gegen je ein Beispielprojekt pro Ökosystem.
# Erwartete Fehlschläge (Negativfälle) lassen sich in einem Reusable-Workflow-Aufruf nicht als Erfolg werten
# und werden daher einmalig von Hand geprüft (siehe tests/build-check/negative/README.md).

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-check.yml
      - .github/workflows/test-build-check.yml
      - tests/build-check/fixtures/**
  pull_request:
    paths:
      - .github/workflows/build-check.yml
      - .github/workflows/test-build-check.yml
      - tests/build-check/fixtures/**

permissions:
  contents: read

concurrency:
  group: test-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    name: ${{ matrix.fixture }}
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - npm-ts
          - pnpm
          - bun
          - expo-like
          - python-uv
          - python-req
          - go
          - docker
          - compose
          - node-postgres
        include:
          - fixture: node-postgres
            postgres: true
    uses: ./.github/workflows/build-check.yml
    with:
      working-directory: tests/build-check/fixtures/${{ matrix.fixture }}
      postgres: ${{ matrix.postgres == true }}
