name: Validate Renovate config

on:
  push:
    branches: [main]
    paths:
      - default.json
      - renovate.json
      - templates/**
      - renovate-ce/**
      - .github/workflows/validate-renovate.yml
  pull_request:
    paths:
      - default.json
      - renovate.json
      - templates/**
      - renovate-ce/**
      - .github/workflows/validate-renovate.yml

permissions:
  contents: read

env:
  # Gepinnte Renovate-Version; Renovate hält sie über customManagers:githubActionsVersions aktuell.
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.155.2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate JSON configs (preset, repo config, template)
        run: >-
          npx --yes --package "renovate@${RENOVATE_VERSION}"
          renovate-config-validator --strict --no-global
          default.json renovate.json templates/renovate.json

      - name: Validate global CE config
        env:
          RENOVATE_CONFIG_FILE: renovate-ce/config.js
        run: >-
          npx --yes --package "renovate@${RENOVATE_VERSION}"
          renovate-config-validator --strict
